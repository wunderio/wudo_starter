      value: '<p>The building takes the snail shell as its archetype: rooms unfold along a spiral that leads from the lively entrance hall to the quiet rooms at its centre. The structure is timber throughout, and it replaces a former kindergarten and boiler house on the same plot.</p><p>Workshops for drawing, embroidery and beadwork open onto a sheltered courtyard, giving every visitor a calm place to learn practical skills.</p>'
