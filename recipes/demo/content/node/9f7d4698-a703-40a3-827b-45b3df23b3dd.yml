                          field_content:
                            -
                              value: '<p data-path-to-node="5">Welcome to our website. By accessing or using this portfolio, you agree to be bound by the following Terms of Service and our Privacy Policy. If you do not agree with any part of these terms, please do not use our website.</p><h2 data-path-to-node="7">1. Intellectual Property &amp; Copyright</h2><p data-path-to-node="8">All content published on this website—including but not limited to architectural designs, 3D renderings, drawings, site plans, photographs, text, graphics, logos, and UI designs—is the exclusive intellectual property of the studio and its respective project partners or clients, unless otherwise stated.</p><ul data-path-to-node="9"><li data-list-item-id="e699b9accd1da0265dcc479f5672b605e"><p data-path-to-node="9,0,0"><b data-path-to-node="9,0,0" data-index-in-node="0"><strong>Usage Restrictions:</strong></b> You may not copy, reproduce, modify, republish, distribute, or commercially exploit any architectural work or imagery from this site without prior written consent.</p></li><li data-list-item-id="ef41ba16fa8e859fde46596661e1726e7"><p data-path-to-node="9,1,0"><b data-path-to-node="9,1,0" data-index-in-node="0"><strong>Personal Use:</strong></b> You may view, download, or print individual pages solely for personal, non-commercial reference or inspiration.</p></li></ul><h2 data-path-to-node="11">2. Project Visualizations &amp; Accuracy</h2><p data-path-to-node="12">The architectural projects, renderings, and site information presented on this website are for informational and portfolio presentation purposes only.</p><ul data-path-to-node="13"><li data-list-item-id="e3f8905dd7fb64fa136e1b0d45d628420"><p data-path-to-node="13,0,0">Renderings and conceptual models may represent proposed or unbuilt designs and may differ from final executed structures.</p></li><li data-list-item-id="e4298e736dab1239d712b04150ae4ab67"><p data-path-to-node="13,1,0">Technical details, dimensions, and materials shown in drawings or photos do not constitute official construction documentation or architectural consultation.</p></li></ul><h2 data-path-to-node="15">3. External Links &amp; Media</h2><p data-path-to-node="16">Our website may contain links to third-party websites or integrate external media galleries. We are not responsible for the content, privacy policies, or practices of any third-party services.</p><h2 data-path-to-node="18">4. Limitation of Liability</h2><p data-path-to-node="19">This website and its content are provided on an "as is" and "as available" basis. The studio makes no warranties, expressed or implied, regarding the accuracy, completeness, or availability of the site materials.</p><p data-path-to-node="20">In no event shall the studio be liable for any damages arising out of the use or inability to use the materials on this website.</p><h2 data-path-to-node="22">5. Modifications to Terms</h2><p data-path-to-node="23">We reserve the right to update or modify these Terms of Service at any time without prior notice. Continued use of the website following any changes constitutes acceptance of the new terms.</p><h2 data-path-to-node="25">6. Contact Information</h2><p data-path-to-node="26">If you have any questions regarding these Terms of Service or wish to request permissions for image licensing/usage, please contact us at:</p><ul data-path-to-node="27"><li data-list-item-id="ef35e1c9411754747921f51fc33efdd1f"><p data-path-to-node="27,0,0"><b data-path-to-node="27,0,0" data-index-in-node="0"><strong>Email:</strong></b> contact@studio.com</p></li><li data-list-item-id="eb1329ffe040e8222477cfabaaf3ed6ee"><p data-path-to-node="27,1,0"><b data-path-to-node="27,1,0" data-index-in-node="0"><strong>Studio Address:</strong></b> Architectural Studio Street 10, Riga, Latvia</p></li></ul>'
