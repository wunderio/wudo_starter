name: Language Switcher
description: "Dropdown listing the site's languages, with the current one on the button."
status: stable
group: Molecules
version: 1.0.2

props:
  type: object
  required:
    - languages
  properties:
    languages:
      type: array
      title: "Available Languages"
      description: "Each language has text, code, url and is_active."
      examples:
        -
          - text: English
            code: en
            url: '#'
            is_active: true
          - text: Latviešu
            code: lv
            url: '#'
            is_active: false


libraryOverrides:
  dependencies:
    - wudo/focus-trap
