'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'

name: Tabs
description: "Accessible tabs. The tab bar is built from the Tab Item components placed in it."
status: experimental
group: Molecules

props:
  type: object
  properties:
    modifier_class:
      type: string
      title: Modifier class
      description: Additional classes
      examples:
        - 'custom-class'

slots:
  tab_content:
    title: Tab Items
    description: Add 'Tab Item' components here.

libraryOverrides:
  dependencies:
    - core/drupal
    - core/once

# Storybook only; Drupal ignores this.
thirdPartySettings:
  sdcStorybook:
    disabledStories:
      - basic
    stories:
      preview:
        slots:
          # Written out as markup: nested hyphenated components do not
          # resolve in the Storybook addon. Same markup as wudo:tab-item.
          tab_content: >
            <div class="tabs__item" data-tab-title="Details"><div class="tabs__panel"><p>Details about the product.</p></div></div>
            <div class="tabs__item" data-tab-title="Delivery"><div class="tabs__panel"><p>Delivered in three to five days.</p></div></div>
            <div class="tabs__item" data-tab-title="Reviews"><div class="tabs__panel"><p>No reviews yet.</p></div></div>
