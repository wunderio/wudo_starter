'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'

name: Breadcrumbs
description: "Breadcrumb trail showing where the current page sits in the site."
status: experimental
group: System

props:
  type: object
  properties:
    items:
      type: array
      title: Breadcrumb items
      description: "Automatically passed from Drupal's breadcrumb block."
      examples:
        -
          - text: Home
            url: '#'
          - text: Articles
            url: '#'
          - text: The Beauty of Ma
    separator:
      type: string
      title: Separator
      default: '/'
    modifier_class:
      type: string
      title: Modifier class
