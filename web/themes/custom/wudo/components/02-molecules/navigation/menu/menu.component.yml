'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'

name: Navigation menu
description: "Navigation menu with support for several levels."
status: experimental
group: Molecules

props:
  type: object
  properties:
    menu_name:
      type: string
      title: Menu name
      description: The machine name of the menu to display.
      examples:
        - main
        - footer

libraryOverrides:
  dependencies:
    - core/drupal
    - core/once
    - wudo/focus-trap

# Storybook only; Drupal ignores this.
thirdPartySettings:
  sdcStorybook:
    disabledStories:
      - basic
    stories:
      preview:
        props:
          items:
            - title: Home
              url: '#'
              in_active_trail: true
            - title: Articles
              url: '#'
            - title: About
              url: '#'
              below:
                - title: Team
                  url: '#'
                - title: Contact
                  url: '#'
