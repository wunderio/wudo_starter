name: Header
status: stable
group: Organisms
description: "Main site header with branding, navigation, and utility slots. Its slots are Twig blocks filled by page.html.twig, so the preview stays empty outside Drupal."
props:
  type: object
  properties:
    is_sticky:
      type: boolean
      title: Is Header Sticky
      default: false
      examples:
        - true
        - false
    sticky_threshold:
      type: integer
      title: Sticky Threshold
      default: 150
      examples:
        - 100
        - 200

slots:
  branding:
    title: Branding
    description: "Slot for the logo and site name."
  navigation:
    title: Main Navigation
    description: "Slot for the main menu."
  utilities:
    title: Header Utilities
    description: "Slot for search, language switcher, etc."

# Storybook only; Drupal ignores this.
thirdPartySettings:
  sdcStorybook:
    disabledStories:
      - basic
    stories:
      preview:
        slots:
          branding:
            - type: component
              component: 'wudo:branding'
          navigation: '<a href="#">Home</a> <a href="#">Articles</a>'
          utilities: "<span>Utilities</span>"
