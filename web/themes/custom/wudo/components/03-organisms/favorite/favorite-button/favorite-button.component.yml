name: Favorite Button
description: "Button that adds an item to, or removes it from, the visitor's favorites stored in the browser."
status: experimental
group: Favorite

props:
  type: object
  properties:
    drawer_id:
      type: string
      title: Drawer ID
      description: "ID of the favorite drawer component to open"
      default: "favorite-drawer"
    content_id:
      type: string
      title: Content ID
      description: "Identificator, node ID or product ID"
      examples:
        - "1"
    label:
      type: string
      title: Label
      description: "Name"
      examples:
        - "The Beauty of Ma"
    icon_type:
      type: string
      title: Icon
      description: Icon name.
      enum:
        - bookmark
        - heart
      examples:
        - 'heart'

libraryOverrides:
  js:
    favorite-button.js: { attributes: { type: module } }
