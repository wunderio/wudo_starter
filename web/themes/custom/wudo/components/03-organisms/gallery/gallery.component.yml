'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'

name: Gallery
description: "Grid of images that open in a lightbox. Its content is a Twig block filled by the gallery node template, so the preview stays empty outside Drupal."
status: experimental
group: Organisms

slots:
  content:
    title: Content
    description: Rendered gallery fields, preserving image formatter links and cache metadata.

# Storybook only; Drupal ignores this.
thirdPartySettings:
  sdcStorybook:
    disabledStories:
      - basic
    stories:
      preview:
        slots:
          content:
            - type: image
              uri: 'https://placehold.co/400x300?text=1'
            - type: image
              uri: 'https://placehold.co/400x300?text=2'
            - type: image
              uri: 'https://placehold.co/400x300?text=3'
