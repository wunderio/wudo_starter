'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'

name: Sticky Header
description: "Wrapper that keeps a header at the top, hiding it on scroll down and showing it again on scroll up."
status: experimental
group: Utilities

props:
  type: object
  properties:
    threshold:
      type: integer
      title: Threshold
      description: "Scroll Threshold"
      default: 150
      examples:
        - 150

    modifier_class:
      type: string
      title: Modifier class
      description: Additional classes.
      examples:
        - 'custom-class'

slots:
  content:
    type: string
    title: Content
    description: Content slot.

# Storybook only; Drupal ignores this.
thirdPartySettings:
  sdcStorybook:
    disabledStories:
      - basic
    stories:
      preview:
        slots:
          content: "<p>Any content can be placed here.</p>"
